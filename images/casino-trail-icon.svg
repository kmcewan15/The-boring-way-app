<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cardClip">
      <rect x="4" y="4" width="392" height="392" rx="40"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- flat backdrop, no gradient -->
    <rect x="4" y="4" width="392" height="392" fill="#123c2c"/>

    <!-- twin "mountain" of stacked fortune: two smooth flat hills, back one darker, front one lighter -->
    <path d="M10,258 C30,140 80,70 135,68 C190,70 235,150 250,258 Z" fill="#7a1e2f"/>
    <path d="M170,258 C190,170 235,100 285,95 C330,100 360,175 372,258 Z" fill="#b9862f"/>

    <!-- flat table-felt ground -->
    <path d="M-5,255 C60,235 130,248 200,242 C270,236 330,246 405,258 L405,405 L-5,405 Z" fill="#c9a25a"/>

    <!-- winding trail of light/chips from the notch across the felt to the corner -->
    <path d="M250,90 C215,150 248,190 208,235 C238,270 275,300 320,335 C365,370 420,400 430,415"
          fill="none" stroke="#efe0ad" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- chip-stack "cactus" totem, flat colors -->
    <g transform="translate(64,300)">
      <g transform="translate(-38,18) rotate(-52)">
        <ellipse cx="0" cy="16" rx="10" ry="6" fill="#7a1e2f"/>
        <ellipse cx="0" cy="4" rx="10" ry="6" fill="#c9a227"/>
        <ellipse cx="0" cy="-8" rx="10" ry="6" fill="#1f5c3f"/>
      </g>
      <g transform="translate(36,32) rotate(48)">
        <ellipse cx="0" cy="14" rx="10" ry="6" fill="#1f5c3f"/>
        <ellipse cx="0" cy="2" rx="10" ry="6" fill="#7a1e2f"/>
      </g>
      <ellipse cx="0" cy="70" rx="20" ry="10" fill="#1f5c3f"/>
      <ellipse cx="0" cy="52" rx="20" ry="10" fill="#c9a227"/>
      <ellipse cx="0" cy="34" rx="20" ry="10" fill="#7a1e2f"/>
      <ellipse cx="0" cy="16" rx="20" ry="10" fill="#c9a227"/>
      <ellipse cx="0" cy="-2" rx="20" ry="10" fill="#1f5c3f"/>
    </g>

    <!-- small flat accent clusters, echoing the shrubs in the reference -->
    <g fill="#1f5c3f">
      <g transform="translate(332,228)">
        <circle cx="-6" cy="4" r="5"/><circle cx="6" cy="4" r="5"/><circle cx="0" cy="-6" r="5"/>
      </g>
      <g transform="translate(140,320)">
        <circle cx="-6" cy="4" r="5"/><circle cx="6" cy="4" r="5"/><circle cx="0" cy="-6" r="5"/>
      </g>
      <g transform="translate(300,352)">
        <circle cx="-6" cy="4" r="5"/><circle cx="6" cy="4" r="5"/><circle cx="0" cy="-6" r="5"/>
      </g>
    </g>

    <!-- small flat chip "pebbles" near the trail -->
    <ellipse cx="352" cy="384" rx="14" ry="7" fill="#7a1e2f"/>
    <ellipse cx="308" cy="392" rx="11" ry="5.5" fill="#c9a227"/>
  </g>

  <rect x="4" y="4" width="392" height="392" rx="40" fill="none" stroke="#d4af37" stroke-width="5"/>
</svg>
