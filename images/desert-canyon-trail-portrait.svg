    <path d="M0 878c79-89 158-140 232-151 50-7 89 19 116 77-97-1-194 48-288 146Z" fill="#CF7961"/>
    <path d="M1080 831c-103-121-204-179-300-164-90 15-147 101-153 227l104 330 349 18Z" fill="#99412F"/>
    <path d="M1080 831c-88-90-173-133-249-125-45 4-82 27-111 69 100 13 193 66 278 161Z" fill="#C66A52"/>
    <path d="M104 1280c112-104 217-135 314-93l-28 324-266 121Z" fill="#AD4933" opacity=".88"/>
    <path d="M975 1287c-119-104-226-127-320-82l21 321 276 116Z" fill="#91402F" opacity=".86"/>

    <!-- pale route: the only high-contrast feature -->
    <path d="M544 814c-41 73 20 119-28 192-49 75 56 119 91 188 39 76-88 124-79 214 7 78 111 125 83 220-24 83-94 116-80 292H310c-16-142 37-237 91-324 44-72-40-126-51-211-15-117 120-171 88-250-28-70-101-116-50-198 45-72 72-125 58-173Z" fill="#F8DFC0"/>
    <path d="M514 1000c-36 70 51 111 75 174 30 81-91 129-79 211 8 59 75 108 74 159-2 83-64 129-85 196h-87c26-84 85-134 84-210 0-64-72-112-74-181-4-110 113-159 77-245-25-60-88-106-45-179Z" fill="#EBC59F" opacity=".7"/>

    <!-- plants -->
    <g fill="#617C62">
      <path d="M174 1301c-31 0-49-25-49-58v-178c0-35 20-58 48-58s49 23 49 58v60c13-19 43-18 50 4 5 16-3 34-18 41l-32 16v57c0 33-18 58-48 58Z"/>
