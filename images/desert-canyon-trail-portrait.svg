<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Winding trail through a desert canyon</title>
  <desc id="desc">A flat terracotta desert illustration with a winding dirt trail, sage green cacti, and open sky for an app interface.</desc>
  <defs>
    <filter id="paper" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="grain"><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <linearGradient id="sky" x1="0" x2="0" y2="1"><stop stop-color="#E9B5AD"/><stop offset="1" stop-color="#F4CFC1"/></linearGradient>
    <linearGradient id="sand" x1="0" x2="0" y2="1"><stop stop-color="#D98969"/><stop offset="1" stop-color="#B9553D"/></linearGradient>
  </defs>
  <g filter="url(#paper)">
    <rect width="1080" height="1920" fill="url(#sky)"/>
    <circle cx="806" cy="315" r="83" fill="#FFE4BB" opacity=".88"/>

    <!-- soft, quiet sky: intentionally clear for top UI -->
    <path d="M0 720C123 633 241 641 361 696c113 52 203 44 321-6 150-64 278-31 398 35v286H0Z" fill="#DCA08C"/>
    <path d="M0 805c131-125 281-136 404-67 93 52 176 53 272 7 127-61 260-37 404 73v251H0Z" fill="#B76147"/>
    <path d="M0 913c138-76 291-78 423-22 96 41 190 34 290-8 127-54 255-32 367 47v990H0Z" fill="url(#sand)"/>

