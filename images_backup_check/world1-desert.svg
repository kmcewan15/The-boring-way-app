<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cardClip">
      <rect x="4" y="4" width="392" height="392" rx="40"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- flat blush-sand backdrop -->
    <rect x="4" y="4" width="392" height="392" fill="#f7ded7"/>

    <!-- twin mesas: back one in shadow (rust), front one sunlit (warm tan) -->
    <path d="M10,258 C30,140 80,70 135,68 C190,70 235,150 250,258 Z" fill="#9c4f36"/>
    <path d="M170,258 C190,170 235,100 285,95 C330,100 360,175 372,258 Z" fill="#d99a6c"/>

    <!-- flat sand ground -->
    <path d="M-5,255 C60,235 130,248 200,242 C270,236 330,246 405,258 L405,405 L-5,405 Z" fill="#f2e0c8"/>

    <!-- winding sand trail from the notch across the desert floor -->
    <path d="M250,90 C215,150 248,190 208,235 C238,270 275,300 320,335 C365,370 420,400 430,415"
          fill="none" stroke="#fbf1de" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- saguaro cactus, bottom left -->
    <g transform="translate(64,300)">
      <rect x="-24" y="-60" width="18" height="46" rx="9" fill="#3f7a5c" transform="rotate(-35 -24 -60)"/>
      <rect x="18" y="-50" width="18" height="42" rx="9" fill="#3f7a5c" transform="rotate(30 18 -50)"/>
      <rect x="-9" y="-78" width="18" height="82" rx="9" fill="#3f7a5c"/>
      <line x1="0" y1="-72" x2="0" y2="-4" stroke="#2f5f46" stroke-width="2" opacity="0.6"/>
      <line x1="-5" y1="-70" x2="-5" y2="-6" stroke="#2f5f46" stroke-width="1.4" opacity="0.4"/>
      <line x1="5" y1="-70" x2="5" y2="-6" stroke="#2f5f46" stroke-width="1.4" opacity="0.4"/>
    </g>

    <!-- small scrub-brush clusters -->
    <g fill="#2f5f46">
      <g transform="translate(332,228)">
        <circle cx="-6" cy="4" r="5"/><circle cx="6" cy="4" r="5"/><circle cx="0" cy="-6" r="5"/>
      </g>
      <g transform="translate(140,320)">
        <circle cx="-6" cy="4" r="5"/><circle cx="6" cy="4" r="5"/><circle cx="0" cy="-6" r="5"/>
      </g>
      <g transform="translate(300,352)">
        <circle cx="-6" cy="4" r="5"/><circle cx="6" cy="4" r="5"/><circle cx="0" cy="-6" r="5"/>
      </g>
    </g>

    <!-- small rocks near the trail -->
    <ellipse cx="352" cy="384" rx="14" ry="7" fill="#8a4a33"/>
    <ellipse cx="308" cy="392" rx="11" ry="5.5" fill="#8a4a33"/>
  </g>

  <rect x="4" y="4" width="392" height="392" rx="40" fill="none" stroke="#3f7a5c" stroke-width="5"/>
</svg>
